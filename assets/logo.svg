<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.24  0 0 0 0 0.12  0 0 0 0.22 0" result="grain"/>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="grainClip"/>
      <feMerge>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="grainClip"/>
      </feMerge>
    </filter>
    <radialGradient id="age" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#7a5328" stop-opacity="0"/>
      <stop offset="100%" stop-color="#7a5328" stop-opacity="0.45"/>
    </radialGradient>
    <clipPath id="mapArea">
      <rect x="31" y="31" width="450" height="450"/>
    </clipPath>
    <path id="mainland" d="M120 150 C150 110 210 120 240 100 C275 78 320 95 345 120 C370 145 410 140 420 175 C432 215 395 235 405 270 C415 305 450 320 430 355 C410 390 360 380 335 405 C310 430 265 420 245 395 C225 370 185 385 160 360 C132 332 150 300 125 275 C100 250 85 215 98 185 C104 168 110 160 120 150 Z"/>
    <path id="isleWest" d="M70 360 C85 345 110 350 112 372 C114 392 92 400 78 392 C66 385 62 370 70 360 Z"/>
    <path id="isleNorth" d="M400 72 C415 62 440 70 438 87 C436 102 415 104 405 96 C396 89 392 79 400 72 Z"/>
    <path id="isleSouth" d="M440 420 C450 412 468 416 466 430 C464 442 446 444 439 436 C434 431 435 424 440 420 Z"/>
    <g id="coast">
      <use xlink:href="#mainland"/>
      <use xlink:href="#isleWest"/>
      <use xlink:href="#isleNorth"/>
      <use xlink:href="#isleSouth"/>
    </g>
    <path id="mountain" d="M-9 5 L0 -7 L9 5 M-3 -3 L-6 5 M0 -7 L-1 5 M3 -3 L4 5" fill="none" stroke="#4a3219" stroke-width="1.2" stroke-linejoin="round" stroke-linecap="round"/>
  </defs>

  <!-- parchment -->
  <rect width="512" height="512" fill="#e6d4a8" filter="url(#paper)"/>

  <!-- map -->
  <g clip-path="url(#mapArea)">
    <g fill="none" stroke-linejoin="round">
      <use xlink:href="#coast" stroke="#a88a5f" stroke-width="25"/>
      <use xlink:href="#coast" stroke="#e6d4a8" stroke-width="22.6"/>
      <use xlink:href="#coast" stroke="#97784c" stroke-width="17"/>
      <use xlink:href="#coast" stroke="#e6d4a8" stroke-width="14.6"/>
      <use xlink:href="#coast" stroke="#7d5f38" stroke-width="9"/>
      <use xlink:href="#coast" stroke="#e6d4a8" stroke-width="6.6"/>
    </g>

    <g stroke="#6b4e2e" stroke-width="0.8" stroke-opacity="0.45" fill="none">
      <path d="M95 31 V481 M159 31 V481 M223 31 V481 M289 31 V481 M353 31 V481 M417 31 V481"/>
      <path d="M31 95 H481 M31 159 H481 M31 223 H481 M31 353 H481 M31 417 H481"/>
      <path d="M31 289 H481" stroke-width="1.4" stroke-dasharray="7 4"/>
    </g>

    <use xlink:href="#coast" fill="#d9bf87" stroke="#3b2814" stroke-width="1.7" stroke-linejoin="round"/>

    <g fill="none" stroke="#5a7a86" stroke-width="1.3" stroke-linecap="round">
      <path d="M318 268 C340 262 352 276 372 270 C388 266 396 276 409 279"/>
      <path d="M170 300 C160 312 152 310 146 320 C142 326 140 330 139 336"/>
    </g>

    <g>
      <use xlink:href="#mountain" x="148" y="208"/>
      <use xlink:href="#mountain" x="166" y="222"/>
      <use xlink:href="#mountain" x="140" y="232"/>
      <use xlink:href="#mountain" x="330" y="150"/>
      <use xlink:href="#mountain" x="350" y="163"/>
      <use xlink:href="#mountain" x="372" y="176"/>
      <use xlink:href="#mountain" x="388" y="320"/>
      <use xlink:href="#mountain" x="404" y="334"/>
    </g>
  </g>

  <!-- neatline -->
  <g fill="none">
    <rect x="22" y="22" width="468" height="468" stroke="#e6d4a8" stroke-width="8"/>
    <rect x="22" y="22" width="468" height="468" stroke="#3b2814" stroke-width="8" stroke-dasharray="26 26"/>
    <rect x="18" y="18" width="476" height="476" stroke="#3b2814" stroke-width="1"/>
    <rect x="26" y="26" width="460" height="460" stroke="#3b2814" stroke-width="1"/>
    <rect x="31" y="31" width="450" height="450" stroke="#3b2814" stroke-width="1.2"/>
    <rect x="10" y="10" width="492" height="492" stroke="#3b2814" stroke-width="3"/>
  </g>

  <rect width="512" height="512" fill="url(#age)"/>

  <!-- A -->
  <path fill="#2b1b0e" fill-rule="evenodd" stroke="#e8d8ae" stroke-width="10" stroke-linejoin="round" paint-order="stroke"
        d="M244 112 L266 112 L365.3 372 Q370 390 396 390 L396 398 L312 398 L312 390 Q330 390 329.6 378 L300.6 302 L194.3 302 L167.4 380 Q164 390 188 390 L188 398 L128 398 L128 390 Q148 390 151.4 380 Z M245 156 L295.2 288 L199.2 288 Z"/>
</svg>
