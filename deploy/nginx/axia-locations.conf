# Include inside the existing TLS server {} for kimtaeeun.site.
# Keep the backend port private: forwarded headers are trusted by Ktor.
location = /axia/api {
    add_header Cache-Control "no-store, private, max-age=0, no-transform" always;
    access_log /var/log/nginx/axia-access.json axia_json;
    error_log /dev/null;
    return 308 https://kimtaeeun.site/axia/api/;
}

location ^~ /axia/api/ {
    # A trailing slash strips only /axia/api/: /axia/api/v1/tasks -> /v1/tasks.
    proxy_pass http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host kimtaeeun.site;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host kimtaeeun.site;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix /axia/api;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;

    client_max_body_size 25m;
    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    proxy_intercept_errors off;
    proxy_next_upstream off;
    gzip off;
    proxy_hide_header Cache-Control;
    proxy_hide_header Pragma;
    proxy_hide_header Expires;
    add_header Cache-Control "no-store, private, max-age=0, no-transform" always;
    add_header Pragma no-cache always;
    add_header X-Content-Type-Options nosniff always;

    access_log /var/log/nginx/axia-access.json axia_json;
    # Native nginx error messages can contain the entire OAuth request line.
    # Failures remain visible in sanitized JSON access logs (status/upstreamStatus/requestId) and server logs.
    error_log /dev/null;
}

location ^~ /axia/updates/ {
    root /srv;
    try_files $uri =404;
    autoindex off;
    limit_except GET { deny all; }
    types {
        application/xml xml;
        application/x-apple-diskimage dmg;
        application/x-msi msi;
    }
    default_type application/octet-stream;
    add_header Cache-Control $axia_update_cache_control always;
    add_header Content-Disposition $axia_update_disposition;
    add_header X-Content-Type-Options nosniff always;
    access_log /var/log/nginx/axia-access.json axia_json;
}
