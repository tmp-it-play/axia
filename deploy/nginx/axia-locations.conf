# Add inside the existing kimtaeeun.site server block, alongside the other application proxies.
# Cloudflare Flexible supplies the visitor scheme in X-Forwarded-Proto.
location = /axia/api {
    absolute_redirect off;
    return 308 /axia/api/;
}

location /axia/api/ {
    proxy_pass         http://127.0.0.1:18080/;
    proxy_http_version 1.1;
    proxy_set_header   Host                $host;
    proxy_set_header   X-Real-IP           $remote_addr;
    proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto   $http_x_forwarded_proto;
    proxy_set_header   X-Forwarded-Prefix  /axia/api;
    proxy_connect_timeout 5s;
    proxy_read_timeout    120s;
    proxy_send_timeout    120s;
    client_max_body_size  25m;
}
