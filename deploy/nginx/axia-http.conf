# Include once inside nginx's http {} block, before the site's server {} block.
# Never log $request, $request_uri, $args, headers, cookies, or bodies: OAuth query values are credentials.
log_format axia_json escape=json
    '{"timestamp":"$time_iso8601","requestId":"$request_id",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"bytes":$body_bytes_sent,"durationSeconds":$request_time,'
    '"upstreamStatus":"$upstream_status","upstreamDurationSeconds":"$upstream_response_time"}';

# Only versioned installer URLs are immutable. Feed and unexpected paths must revalidate.
map "$status:$uri" $axia_update_cache_control {
    default "no-cache, max-age=0, must-revalidate";
    ~^(?:200|206|304):/axia/updates/(?:macos/arm64|windows/x64)/[0-9]+\.[0-9]+\.[0-9]+/Axia-[0-9]+\.[0-9]+\.[0-9]+\.(?:dmg|msi)$ "public, max-age=31536000, immutable";
}
map $axia_update_cache_control $axia_update_disposition {
    default "";
    "public, max-age=31536000, immutable" attachment;
}
