name: Windows native verification (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: axia-windows-native-verification
  cancel-in-progress: false

jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      AXIA_RELEASE_BUILD: 'false'
      AXIA_RELEASE_VERSION: '1.0.0'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Temporary, reviewed verification sources; never publish a release.
          ref: 66fe75debf25ec895a92637b350d6aab86da4dfe
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.14'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: x64
      - name: Build the real x64 updater and development MSI
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/release/prepare_native.py
          if ($LASTEXITCODE -ne 0) { throw 'Native updater compilation failed.' }
          ./gradlew.bat :app:desktopApp:packageMsi :app:desktopApp:exportVerificationClasspath -I scripts/verification/windows-verification.init.gradle --no-daemon --no-configuration-cache --console=plain
          if ($LASTEXITCODE -ne 0) { throw 'Desktop MSI packaging failed.' }
      - name: Verify real Windows staging, junctions, payload locks and READY handoff
        run: |
          $ErrorActionPreference = 'Stop'
          $axiaClasspath = Get-Content -Raw -LiteralPath build/windows-native-evidence/classpath.txt
          $axiaClasses = Join-Path $PWD 'build/windows-native-verifier-classes'
          New-Item -ItemType Directory -Force -Path $axiaClasses | Out-Null
          javac --release 21 -encoding UTF-8 -cp $axiaClasspath -d $axiaClasses scripts/verification/WindowsNativeStaging.java
          if ($LASTEXITCODE -ne 0) { throw 'Temporary Windows verifier did not compile.' }
          $axiaRunner = Join-Path $PWD 'app/desktopApp/build/generated/updater-resources/windows-x64/updates/AxiaUpdateRunner.exe'
          java -cp "$axiaClasses;$axiaClasspath" team.themoment.axia.desktop.updates.WindowsNativeStaging $axiaRunner (Join-Path $PWD 'build/windows-native-evidence')
          if ($LASTEXITCODE -ne 0) { throw 'Windows native staging verification failed.' }
      - name: Install, launch and uninstall the development MSI on this temporary runner
        run: |
          $ErrorActionPreference = 'Stop'
          $axiaPackages = @(Get-ChildItem -LiteralPath app/desktopApp/build/compose/binaries/main/msi -Filter '*.msi')
          if ($axiaPackages.Count -ne 1) { throw 'Expected exactly one development MSI.' }
          ./scripts/verification/windows_native.ps1 -MsiPath $axiaPackages[0].FullName -Version '1.0.0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: windows-native-evidence
          path: |
            build/windows-native-evidence/*.json
            build/windows-native-evidence/*.txt
            build/windows-native-evidence/*.msi.log
            !build/windows-native-evidence/classpath.txt
          if-no-files-found: warn
          retention-days: 3
