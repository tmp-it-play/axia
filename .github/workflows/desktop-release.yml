name: Desktop release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Canonical MAJOR.MINOR.PATCH release version
        required: true
        type: string
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to release
        required: true
        type: string
      confirm_release:
        description: Type RELEASE to authorize signing, notarization, and publication
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: axia-desktop-release
  cancel-in-progress: false

env:
  AXIA_RELEASE_BUILD: 'true'
  AXIA_RELEASE_VERSION: ${{ inputs.version }}
  AXIA_RELEASE_TAG: ${{ inputs.tag }}
  AXIA_CONFIRM_RELEASE: ${{ inputs.confirm_release }}
  # Repository-level Actions variable, available before the deployment environment is evaluated.
  AXIA_FEED_REMOTE_ROOT: ${{ vars.AXIA_FEED_REMOTE_ROOT }}

jobs:
  preflight:
    runs-on: ubuntu-24.04
    environment: desktop-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Require explicit release and every signing/publication credential
        run: |
          python scripts/release/publish.py --check-remote-root
          python scripts/release/release.py --preflight
        env:
          AXIA_MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.AXIA_MACOS_CERTIFICATE_P12_BASE64 }}
          AXIA_MACOS_CERTIFICATE_PASSWORD: ${{ secrets.AXIA_MACOS_CERTIFICATE_PASSWORD }}
          AXIA_MACOS_SIGNING_IDENTITY: ${{ secrets.AXIA_MACOS_SIGNING_IDENTITY }}
          AXIA_APPLE_TEAM_ID: ${{ secrets.AXIA_APPLE_TEAM_ID }}
          AXIA_NOTARY_KEY_P8: ${{ secrets.AXIA_NOTARY_KEY_P8 }}
          AXIA_NOTARY_KEY_ID: ${{ secrets.AXIA_NOTARY_KEY_ID }}
          AXIA_NOTARY_ISSUER_ID: ${{ secrets.AXIA_NOTARY_ISSUER_ID }}
          AXIA_MACOS_ED25519_PRIVATE_KEY: ${{ secrets.AXIA_MACOS_ED25519_PRIVATE_KEY }}
          AXIA_MACOS_ED25519_PUBLIC_KEY: ${{ secrets.AXIA_MACOS_ED25519_PUBLIC_KEY }}
          AXIA_WINDOWS_ED25519_PRIVATE_KEY: ${{ secrets.AXIA_WINDOWS_ED25519_PRIVATE_KEY }}
          AXIA_WINDOWS_ED25519_PUBLIC_KEY: ${{ secrets.AXIA_WINDOWS_ED25519_PUBLIC_KEY }}
          AXIA_FEED_SSH_HOST: ${{ secrets.AXIA_FEED_SSH_HOST }}
          AXIA_FEED_SSH_USER: ${{ secrets.AXIA_FEED_SSH_USER }}
          AXIA_FEED_SSH_PRIVATE_KEY: ${{ secrets.AXIA_FEED_SSH_PRIVATE_KEY }}
          AXIA_FEED_SSH_KNOWN_HOSTS: ${{ secrets.AXIA_FEED_SSH_KNOWN_HOSTS }}

  macos:
    needs: preflight
    runs-on: macos-15
    environment: desktop-release
    timeout-minutes: 90
    env:
      AXIA_MACOS_SIGNING_IDENTITY: ${{ secrets.AXIA_MACOS_SIGNING_IDENTITY }}
      AXIA_APPLE_TEAM_ID: ${{ secrets.AXIA_APPLE_TEAM_ID }}
      AXIA_NOTARY_KEY_P8: ${{ secrets.AXIA_NOTARY_KEY_P8 }}
      AXIA_NOTARY_KEY_ID: ${{ secrets.AXIA_NOTARY_KEY_ID }}
      AXIA_NOTARY_ISSUER_ID: ${{ secrets.AXIA_NOTARY_ISSUER_ID }}
      AXIA_MACOS_ED25519_PRIVATE_KEY: ${{ secrets.AXIA_MACOS_ED25519_PRIVATE_KEY }}
      AXIA_MACOS_ED25519_PUBLIC_KEY: ${{ secrets.AXIA_MACOS_ED25519_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: aarch64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.AXIA_MACOS_CERTIFICATE_P12_BASE64 }}
          p12-password: ${{ secrets.AXIA_MACOS_CERTIFICATE_PASSWORD }}
      - name: Build arm64 bridge, sign, notarize, staple, and sign appcast
        run: python scripts/release/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: app/desktopApp/build/updaters/release/macos-arm64/
          if-no-files-found: error
          retention-days: 7

  windows:
    needs: preflight
    runs-on: windows-2025
    environment: desktop-release
    timeout-minutes: 45
    env:
      AXIA_WINDOWS_ED25519_PRIVATE_KEY: ${{ secrets.AXIA_WINDOWS_ED25519_PRIVATE_KEY }}
      AXIA_WINDOWS_ED25519_PUBLIC_KEY: ${{ secrets.AXIA_WINDOWS_ED25519_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          architecture: x64
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          architecture: x64
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Build x64 runner and MSI, require Ed25519 verification
        run: python scripts/release/release.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: app/desktopApp/build/updaters/release/windows-x64/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-24.04
    environment: desktop-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts
      - name: Publish GitHub assets and immutable public mirrors before atomic feed promotion
        run: python scripts/release/publish.py --artifacts release-artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          AXIA_FEED_SSH_HOST: ${{ secrets.AXIA_FEED_SSH_HOST }}
          AXIA_FEED_SSH_USER: ${{ secrets.AXIA_FEED_SSH_USER }}
          AXIA_FEED_SSH_PRIVATE_KEY: ${{ secrets.AXIA_FEED_SSH_PRIVATE_KEY }}
          AXIA_FEED_SSH_KNOWN_HOSTS: ${{ secrets.AXIA_FEED_SSH_KNOWN_HOSTS }}
