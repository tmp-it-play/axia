name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve version from tag
        id: version
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::태그는 vMAJOR.MINOR.PATCH 형식이어야 합니다: $GITHUB_REF_NAME"
            exit 1
          fi
          echo "value=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"

      - name: Build MSI
        run: ./gradlew :desktopApp:packageMsi "-Paxia.version=${{ steps.version.outputs.value }}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" desktopApp/build/compose/binaries/main/msi/*.msi \
            --draft \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes ""
